kind = "mobile"
previewPath = "/runbuddy-mobile/"
title = "RunBuddy Mobile"
description = "A native iOS and Android companion for RunBuddy, helping runners discover local running buddies, manage connections, and message through the existing RunBuddy API."
version = "1.0.0"
id = "artifacts/runbuddy-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/runbuddy-mobile/" ]
localPort = 24678

[services.development]
run = "pnpm --filter @workspace/runbuddy-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/runbuddy-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/runbuddy-mobile", "run", "serve" ]

[services.env]
PORT = "24678"
BASE_PATH = "/runbuddy-mobile/"
