name: RunMatch inbox badge browsers

on:
  pull_request:
  push:
    branches:
      - main
      - runmatch-cross-browser-task99-20261009
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inbox-badge-account-switch:
    name: Firefox and WebKit account-switch badges
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Firefox and WebKit
        run: pnpm exec playwright install --with-deps firefox webkit

      - name: Check Clerk E2E secrets
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          missing=0
          for key in CLERK_SECRET_KEY CLERK_PUBLISHABLE_KEY VITE_CLERK_PUBLISHABLE_KEY; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Configure the $key GitHub Actions secret to run the RunMatch browser test."
              missing=1
            fi
          done
          exit "$missing"

      - name: Run cross-browser inbox badge test
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: >-
          pnpm exec playwright test
          --config artifacts/runmatch/playwright.config.ts
          --project=webkit
          --project=firefox
          --grep "inbox badges show only the active account unread count during account switches"

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runmatch-playwright-diagnostics
          path: .cache/playwright/runmatch-auth/
          if-no-files-found: ignore
          retention-days: 5
